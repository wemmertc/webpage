<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-170807493-1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'UA-170807493-1');
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "Person",
  "name": "Cédric Wemmert",
  "url": "https://wemmertc.github.io/webpage/",
  "image": "https://wemmertc.github.io/webpage/assets/images/me.jpg",
  "sameAs": [
    "https://twitter.com/CedricWemmert",
    "https://www.linkedin.com/in/cedricwemmert",
    "https://github.com/wemmertc",
    "https://wemmertc.github.io/webpage/"
  ],
  "jobTitle": "Professor of Computer Science",
  "worksFor": {
    "@type": "Organization",
    "name": "University of Strasbourg"
  }
}
</script>

{% seo %}
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% if page.stylesheet %}<link rel="stylesheet" href="{{ page.stylesheet | append: '?v=' | append: site.github.build_revision | relative_url }}">{% endif %}
    <script src="{{ '/assets/js/main.js?v=' | append: site.github.build_revision | relative_url }}" defer></script>
    <meta name="description" content="Personal page of Cédric Wemmert, Professor in Computer Science and Data Scientist working on data science, data mining, histopathology images, machine learning, big data, artificial intelligence, deep learning." />
    <meta name="keywords" content="cedric wemmert, cédric wemmert, data science, data mining, machine learning, big data, artificial intelligence, deep learning, strasbourg, alsace, bas-rhin, intelligence artificielle, transfer learning, data augmentation" />

  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Top bar. The links to the sections of the home page are marked as current by assets/js/main.js. -->
    <header class="site-header">
      <div class="container">
        <a class="brand" href="{{ '/' | relative_url }}">Cédric Wemmert</a>
        <nav class="site-nav" aria-label="Main" data-spy>
          <a href="{{ '/#about' | relative_url }}">About</a>
          <a href="{{ '/#research' | relative_url }}">Research</a>
          <a href="{{ '/#teaching' | relative_url }}">Teaching</a>
          <a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications/' %} aria-current="page"{% endif %}>Publications</a>
        </nav>
      </div>
    </header>

    <main id="main" class="container">
{{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; {{ site.time | date: '%Y' }} Cédric Wemmert &middot; Last updated {{ site.time | date: '%B %Y' }}</p>
        {% include profiles.html %}
      </div>
    </footer>

    {% if site.google_analytics %}
      <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
        ga('create', '{{ site.google_analytics }}', 'auto');
        ga('send', 'pageview');
      </script>
    {% endif %}
  </body>
</html>
